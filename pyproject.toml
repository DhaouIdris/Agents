[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "passerelle-learning"
version = "0.1.0"
description = "Assistant local : conversations, streaming, SQLite et mémoire (M1–M3)."
requires-python = ">=3.10"
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
notebook = ["ipykernel>=6,<8", "jupyterlab>=4,<5"]
dev = ["nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["passerelle*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
